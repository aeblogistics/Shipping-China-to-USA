name: Crawl and Generate Sitemap

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install sitemap-generator-cli
        run: npm install -g sitemap-generator-cli

      - name: Generate Sitemap
        run: |
          sitemap-generator https://aeblogistics.github.io/Shipping-China-to-USA/ -f sitemap.xml
          # 确保文件第一行是标准的 XML 声明，且不会重复添加
          if ! head -n 1 sitemap.xml | grep -q "<?xml"; then
            echo '<?xml version="1.0" encoding="UTF-8"?>' | cat - sitemap.xml > temp.xml && mv temp.xml sitemap.xml
          fi

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git diff --staged --quiet || git commit -m "Auto update sitemap with XML declaration"
          git push
